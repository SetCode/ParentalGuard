name: Release

# 发布流程不需要任何 Secret：
#   1. 本地 tools/release.sh 构建并签名 APK，产物提交到仓库 Release/ 目录（ParentalGuard-v<版本>.apk + .sha256）
#   2. 打 tag v<版本> 并推送
#   3. 本工作流校验产物、生成发布说明，用自带的 GITHUB_TOKEN 创建 Release
# 私钥只在开发者本机，永不进入 CI，也不进仓库。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，例如 1.0.1），用于重发已提交的产物'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含全部 tag，用于生成变更清单）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::版本号格式非法：'$VERSION'，应形如 1.0.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION"

      - name: 校验安装包存在
        id: apk
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          APK="Release/ParentalGuard-v$V.apk"
          SHA="$APK.sha256"
          if [ ! -f "$APK" ]; then
            echo "::error::Release/ 目录缺少 $APK"
            echo "请先在本地执行 ./tools/release.sh $V --push 构建并提交产物"
            exit 1
          fi
          if [ ! -f "$SHA" ]; then
            echo "::error::缺少校验文件 $SHA"
            exit 1
          fi
          echo "产物大小：$(wc -c < "$APK") 字节"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 校验 sha256 与包内版本号
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          APK="${{ steps.apk.outputs.path }}"
          # 校验文件里记录的路径可能含旧目录前缀，只比对哈希值
          EXPECT=$(awk '{print $1}' "${{ steps.apk.outputs.sha }}")
          ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
          echo "记录值：$EXPECT"
          echo "实际值：$ACTUAL"
          [ "$EXPECT" = "$ACTUAL" ] || { echo "::error::APK 与 sha256 记录不一致，产物可能被替换过"; exit 1; }
          # 核对包内版本号，防止提交了版本对不上的包
          AAPT2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -r | head -n1 || true)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK" | grep -E '^package:' | head -n1)
            echo "$BADGING"
            printf '%s' "$BADGING" | grep -q "versionName='$V'" || { echo "::error::包内 versionName 与 tag 不一致"; exit 1; }
          else
            echo "未找到 aapt2，跳过包内版本校验"
          fi

      - name: 生成发布说明
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          FILE="docs/releases/v$V.md"
          if [ -f "$FILE" ]; then
            cp "$FILE" release-notes.md
            echo "使用手写发布说明 $FILE"
            exit 0
          fi
          PREV=$(git tag --sort=-v:refname | grep -vx "v$V" | head -n1 || true)
          {
            echo "## 儿童设备管控 v$V"
            echo
            if [ -n "$PREV" ]; then
              echo "**变更内容（自 $PREV）**"
              echo
              git log --no-merges --pretty=format:"- %s" "$PREV..HEAD"
            else
              echo "**变更内容**"
              echo
              git log --no-merges --pretty=format:"- %s"
            fi
            echo
            echo
            echo "下载 \`ParentalGuard-v$V.apk\` 覆盖安装即可，本机已有规则与计时数据不受影响。"
            echo
            echo "校验：\`sha256sum ParentalGuard-v$V.apk\` 应与附件 \`.sha256\` 一致。"
          } > release-notes.md
          cat release-notes.md

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          APK="${{ steps.apk.outputs.path }}"
          SHA="${{ steps.apk.outputs.sha }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "ParentalGuard $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖附件与说明"
            gh release upload "$TAG" "$APK" "$SHA" --clobber
            gh release edit "$TAG" --title "ParentalGuard $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --title "ParentalGuard $TAG" \
              --notes-file release-notes.md \
              --latest
          fi
          gh release view "$TAG" --json tagName,name,assets,url
